
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Mentor | MentoriaPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #111827;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .form-container {
            max-width: 750px;
            margin: 45px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .btn-primary {
            background: #635bff;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #5148e5;
        }

        .form-control {
            padding: 11px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">MentoriaPro</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Voltar</a>
    </div>
</nav>

<div class="container form-container">

    <div class="form-card">

        <h2 class="fw-bold mb-2">Complete seu perfil de mentor</h2>

        <p class="text-muted mb-4">
            Conte um pouco sobre sua experiência para que os mentorados encontrem você.
        </p>

        <form id="formMentor">

            <div class="mb-3">
                <label for="especialidade" class="form-label">Área de especialidade</label>
                <input
                    type="text"
                    class="form-control"
                    id="especialidade"
                    placeholder="Ex.: Desenvolvimento Java"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="experiencia" class="form-label">Anos de experiência</label>
                <input
                    type="number"
                    class="form-control"
                    id="experiencia"
                    min="0"
                    placeholder="Ex.: 5"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="valor" class="form-label">Valor por hora (R$)</label>
                <input
                    type="number"
                    class="form-control"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex.: 50,00"
                >
            </div>

            <div class="mb-4">
                <label for="descricao" class="form-label">Descrição profissional</label>
                <textarea
                    class="form-control"
                    id="descricao"
                    rows="5"
                    placeholder="Conte sobre sua trajetória, conhecimentos e como pode ajudar os mentorados..."
                ></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Salvar perfil
            </button>

        </form>

    </div>
</div>

<script>
    document.getElementById("formMentor").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Demonstração: o perfil ainda não está conectado ao banco de dados.");
    });
</script>

</body>
</html>

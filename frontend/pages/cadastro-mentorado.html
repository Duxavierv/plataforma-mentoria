
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Mentorado | MentoriaPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #111827;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .form-container {
            max-width: 750px;
            margin: 45px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .btn-primary {
            background: #635bff;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #5148e5;
        }

        .form-control {
            padding: 11px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">MentoriaPro</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Voltar</a>
    </div>
</nav>

<div class="container form-container">

    <div class="form-card">

        <h2 class="fw-bold mb-2">Complete seu perfil de mentorado</h2>

        <p class="text-muted mb-4">
            Conte quais são seus objetivos para encontrarmos as melhores mentorias para você.
        </p>

        <form id="formMentorado">

            <div class="mb-3">
                <label for="areaInteresse" class="form-label">
                    Área de interesse
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="areaInteresse"
                    placeholder="Ex.: Tecnologia, Programação, Gestão..."
                    required
                >
            </div>

            <div class="mb-4">
                <label for="objetivo" class="form-label">
                    Quais são seus objetivos?
                </label>

                <textarea
                    class="form-control"
                    id="objetivo"
                    rows="5"
                    placeholder="Conte o que deseja aprender ou desenvolver com a mentoria..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Salvar perfil
            </button>

        </form>

    </div>
</div>

<script>
    document.getElementById("formMentorado").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Demonstração: o perfil ainda não está conectado ao banco de dados.");
    });
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | MentoriaPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #111827, #25245c);
            display: flex;
            flex-direction: column;
        }

        .cadastro-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .cadastro-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,.2);
        }

        .cadastro-card h2 {
            font-weight: 800;
            color: #111827;
        }

        .cadastro-card p {
            color: #6b7280;
        }

        .cadastro-card .form-control,
        .cadastro-card .form-select {
            padding: 12px;
            border-radius: 10px;
        }

        .cadastro-card .btn {
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
        }

        .brand {
            color: white;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        .brand span {
            color: #9993ff;
        }

        .cadastro-footer {
            color: #d1d5db;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="brand">
                Mentoria<span>Pro</span>
            </a>

            <a href="../index.html" class="btn btn-outline-light">
                Voltar ao início
            </a>
        </div>
    </nav>

    <main class="cadastro-container">
        <div class="cadastro-card">

            <div class="text-center mb-4">
                <h2>Crie sua conta</h2>
                <p>Comece a desenvolver seu futuro profissional.</p>
            </div>

            <div id="mensagem" class="alert d-none" role="alert"></div>

            <form id="formCadastro">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="exemplo@email.com"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input
                        type="tel"
                        class="form-control"
                        id="telefone"
                        placeholder="(11) 99999-9999"
                        maxlength="20"
                    >
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="8"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="tipo_usuario" class="form-label">
                        Tipo de conta
                    </label>

                    <select class="form-select" id="tipo_usuario" required>
                        <option value="">Selecione seu perfil</option>
                        <option value="MENTOR">Quero ser mentor</option>
                        <option value="MENTORADO">Quero encontrar um mentor</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Criar minha conta
                </button>

            </form>

            <div class="text-center mt-4">
                <p>
                    Já possui uma conta?
                    <a href="login.html" class="text-primary fw-bold">
                        Fazer login
                    </a>
                </p>
            </div>

        </div>
    </main>

    <footer class="cadastro-footer">
        © 2026 MentoriaPro — Todos os direitos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

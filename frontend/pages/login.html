
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | MentoriaPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #111827, #25245c);
            display: flex;
            flex-direction: column;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,.2);
        }

        .login-card h2 {
            font-weight: 800;
            color: #111827;
        }

        .login-card p {
            color: #6b7280;
        }

        .login-card .form-control {
            padding: 13px;
            border-radius: 10px;
        }

        .login-card .btn {
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
        }

        .brand {
            color: white;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        .brand span {
            color: #9993ff;
        }

        .login-footer {
            color: #d1d5db;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="brand">
                Mentoria<span>Pro</span>
            </a>
            <a href="../index.html" class="btn btn-outline-light">
                Voltar ao início
            </a>
        </div>
    </nav>

    <main class="login-container">
        <div class="login-card">

            <div class="text-center mb-4">
                <h2>Bem-vindo de volta!</h2>
                <p>Acesse sua conta e continue sua jornada.</p>
            </div>

            <div id="mensagem" class="alert d-none" role="alert"></div>

            <form id="formLogin">

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Entrar
                </button>

            </form>

            <div class="text-center mt-4">
                <p>
                    Ainda não tem uma conta?
                    <a href="cadastro.html" class="text-primary fw-bold">
                        Criar conta
                    </a>
                </p>
            </div>

        </div>
    </main>

    <footer class="login-footer">
        © 2026 MentoriaPro — Todos os direitos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
